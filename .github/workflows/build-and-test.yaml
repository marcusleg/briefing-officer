name: Build and Test

on: push

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Check Code Formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run Type Check
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run Unit and Integration Tests
        run: npm run test

  build:
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET: any-value-will-do-at-build-time1
      AZURE_OPENAI_API_KEY: 0123456789abcdef
      AZURE_OPENAI_MODEL: gpt-0-pico
      AZURE_OPENAI_RESOURCE_NAME: oai-example-dev-001
      DATABASE_URL: file:/tmp/database.sqlite
      OPENAI_API_KEY=: any-value-will-do-at-build-time
      OPENAI_API_URL=: http://localhost

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client and create database file
        run: npx prisma generate && npx prisma db push
      - name: Run Build
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-artifact
          path: .next/
          if-no-files-found: "error"
          include-hidden-files: "true"
          retention-days: 1

