  # Fails when .github/workflows/actions.lock is out of sync with the workflows
  # or a locked pin no longer verifies upstream. Rerun `gh actions-lock` after
  # changing any `uses:` to fix it.
  verify-actions-lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify Actions Lockfile
        run: gh actions-lock --verify

  # Fails when a value in helm-chart/values.yaml has no @param annotation or
  # helm-chart/README.md is stale. Run `npm run helm:readme` to fix it.
  helm-chart-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Generate Helm Chart README
        run: npm run helm:readme
      - name: Check Helm Chart README Is Up to Date
        run: git diff --exit-code -- helm-chart/README.md

  render-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Render Helm Chart
        uses: WyriHaximus/github-action-helm3@v4.0.2
        with:
          exec: |
            helm template briefing-officer helm-chart \
            --set httpRoute.enabled=true
