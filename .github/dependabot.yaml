version: 2
# Node.js runtime bumps arrive as one pull request: the container base image and
# the matching @types/node typings should always move together.
multi-ecosystem-groups:
  node:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    patterns:
      - "@types/node"
    multi-ecosystem-group: "node"
    groups:
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "*node"
    multi-ecosystem-group: "node"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
