version: 2
# Node.js runtime bumps arrive as one pull request: the container base image and
# the matching @types/node typings should always move together.
multi-ecosystem-groups:
  node:
    schedule:
      interval: "weekly"
# Every ecosystem waits 7 days before proposing a new release, so a compromised
# version is usually caught and yanked before it reaches us. Security updates
# ignore the cooldown.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    patterns:
      - "@types/node"
    multi-ecosystem-group: "node"
    groups:
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 7
    patterns:
      - "*node"
    multi-ecosystem-group: "node"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
