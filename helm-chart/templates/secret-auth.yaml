{{/*
AUTH_SECRET signs session cookies, so it has to survive upgrades — regenerating
it signs every user out. `lookup` reads back the value written on the previous
install and reuses it; it only generates on the very first one.

`lookup` returns nothing without a cluster connection, so `helm template` and
client-side diffs render a fresh value every time. That is cosmetic, but it
does mean a HelmRelease with driftDetection.mode=enabled would see drift on
every reconcile. Leave drift detection off, or set `authSecret` explicitly.
*/}}
{{- $name := printf "%s-auth" (include "briefing-officer.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $authSecret := .Values.authSecret }}
{{- if not $authSecret }}
{{- if and $existing $existing.data (hasKey $existing.data "AUTH_SECRET") }}
{{- $authSecret = index $existing.data "AUTH_SECRET" | b64dec }}
{{- else }}
{{- $authSecret = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "briefing-officer.labels" . | nindent 4 }}
type: Opaque
data:
  AUTH_SECRET: {{ $authSecret | b64enc | quote }}
