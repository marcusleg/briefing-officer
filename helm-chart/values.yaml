image:
  repository: ghcr.io/marcusleg/briefing-officer
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Signs session cookies. Generated on first install and reused on every upgrade
# thereafter; set it here only to pin a specific value, or supply AUTH_SECRET in
# the release secret, which takes precedence over both.
authSecret: ""

# Public URL the application is reached at, including scheme and trailing
# slash. Defaults to https://<first httpRoute hostname>/, or
# http://localhost:3000/ when no hostname is set.
baseUrl: ""

service:
  type: ClusterIP
  port: 80

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #   - name: my-gateway
  #     namespace: default
  #     sectionName: http
  hostnames: []

networkPolicy:
  enabled: false
  extraIngressRules:
#    - from:
#        - namespaceSelector:
#            matchExpressions:
#              - key: name
#                operator: In
#                values:
#                  - my-gateway-or-ingress-namespace
#      ports:
#        - protocol: TCP
#          port: 3000

priorityClassName: ""

# Extra environment variables for the application container. Appended after
# the chart's own, so an entry here wins on a name clash.
env: []
#  - name: OPENAI_BASE_URL
#    value: https://api.openai.com/v1

persistence:
  enabled: true
  size: 1Gi
  # Empty means the cluster's default StorageClass.
  storageClassName: ""
  # Use a PVC declared outside the chart instead of creating one.
  existingClaim: ""

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}
